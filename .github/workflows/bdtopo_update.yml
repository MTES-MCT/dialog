name: BD TOPO Update

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Base BDTOPO cible'
        required: false
        default: '2025'
        type: choice
        options:
          - '2025'
          - '2025_2'
      skip_download:
        description: "Ne pas retélécharger depuis l'IGN : réutiliser les geopackages déjà présents sur S3 (run précédent)"
        required: false
        default: false
        type: boolean
      skip_import:
        description: "Ne pas importer : seulement rafraîchir les geopackages sur S3 depuis l'IGN"
        required: false
        default: false
        type: boolean
      keep_archives:
        description: "Conserver les archives .7z téléchargées après l'extraction"
        required: false
        default: false
        type: boolean

  # schedule:
  #   # Voir https://crontab.guru/ : les 1er et 16 de chaque mois à 02h00 GMT (~tous les 15 jours)
  #   - cron: '0 2 1,16 * *'

permissions:
  contents: read

# Un seul pipeline BD TOPO à la fois, quelle que soit la base cible : les geopackages
# et le manifest sur S3 (bdtopo/*.gpkg, bdtopo/manifest.json) sont partagés entre cibles,
# deux runs concurrents pourraient donc se marcher dessus.
concurrency:
  group: bdtopo-update
  cancel-in-progress: false

env:
  BDTOPO_TARGET: ${{ github.event.inputs.target || '2025' }}
  SKIP_DOWNLOAD: ${{ github.event.inputs.skip_download || 'false' }}
  KEEP_ARCHIVES: ${{ github.event.inputs.keep_archives || 'false' }}
  # Les scripts Python écrivent sur une sortie non-TTY : sans cela, leurs logs
  # n'apparaissent qu'en fin de step (voire jamais si le job est annulé).
  PYTHONUNBUFFERED: "1"
  BDTOPO_2025_DATABASE_URL: ${{ secrets.BDTOPO_2025_DATABASE_URL }}
  BDTOPO_2025_2_DATABASE_URL: ${{ secrets.BDTOPO_2025_2_DATABASE_URL }}
  S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
  S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}

jobs:
  # Étape 1 : télécharge l'archive BD TOPO Express depuis l'IGN (~21 Go en 6 parties),
  # en extrait uniquement les geopackages des tables cibles et les uploade sur S3 avec
  # un manifest (millésime + chemins). L'import est volontairement ignoré ici.
  # Expose aussi la liste des tables (depuis le config) pour piloter la matrice d'import.
  # Avec skip_download, vérifie seulement que le manifest d'un run précédent est sur S3.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tables: ${{ steps.tables.outputs.tables }}
      # Millésime lu dans le manifest S3, affiché dans la notification Tchap.
      millesime: ${{ steps.geopackages.outputs.millesime }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # Archive (~21 Go) + geopackages extraits (~15-20 Go) : on libère de l'espace sur le runner.
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install system dependencies
        # 7z : listing puis extraction sélective des geopackages depuis l'archive multi-volumes.
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Install Python dependencies
        run: pip install requests

      - name: Compute table matrix
        id: tables
        # La matrice d'import est dérivée automatiquement du fichier de config,
        # pour rester synchronisée avec les tables réellement importées.
        run: echo "tables=$(jq -c '[.tables[].name]' tools/bdtopo_update.config.json)" >> "$GITHUB_OUTPUT"

      - name: Prepare BD TOPO geopackages (download IGN + extract + upload S3)
        id: geopackages
        run: >
          make ci_bdtopo_prepare
          BDTOPO_TARGET="${BDTOPO_TARGET}"
          SKIP_DOWNLOAD="${SKIP_DOWNLOAD}"
          KEEP_ARCHIVES="${KEEP_ARCHIVES}"

  # Étape 2 : un job par table, en parallèle. Chaque job télécharge le geopackage de sa
  # table depuis S3 sur le disque du runner, ouvre un tunnel vers la base cible et importe
  # cette seule table (ogr2ogr), sans recréer les index (--skip-migrate).
  # Si skip_import est coché, cette étape et finalize (qui en dépend) sont ignorées.
  import:
    needs: prepare
    if: ${{ !inputs.skip_import }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        table: ${{ fromJson(needs.prepare.outputs.tables) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # Le geopackage de troncon_de_route fait plusieurs Go ; l'espace libre par défaut est juste.
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install system dependencies
        # PostgreSQL client : VACUUM ANALYZE après l'import de la table.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Python dependencies
        run: pip install requests

      - name: Install Scalingo CLI
        run: curl -O https://cli-dl.scalingo.com/install && bash install

      - name: Install SSH key
        # Credit: https://stackoverflow.com/a/69234389
        run: |
          mkdir -p ~/.ssh
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.GH_SCALINGO_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa

      - name: Add Scalingo as a known host
        run: |
          ssh-keyscan -H ssh.osc-fr1.scalingo.com >> ~/.ssh/known_hosts

      - name: Import table ${{ matrix.table }}
        run: >
          make ci_bdtopo_import_table
          BDTOPO_TARGET="${BDTOPO_TARGET}"
          BDTOPO_TABLE="${{ matrix.table }}"

  # Étape 3 : une fois toutes les tables importées, recrée l'ensemble des index,
  # extensions et fonctions, et enregistre le millésime (lu depuis le manifest S3).
  # ogr2ogr -overwrite recrée les tables : sans cette étape, la base n'a plus d'index.
  finalize:
    needs: import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # Dépendance runtime de l'extension PHP GD.
        run: |
          sudo apt-get update
          sudo apt-get install -y libxpm4

      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Python dependencies
        run: pip install requests

      - name: Install Scalingo CLI
        run: curl -O https://cli-dl.scalingo.com/install && bash install

      - name: Install SSH key
        # Credit: https://stackoverflow.com/a/69234389
        run: |
          mkdir -p ~/.ssh
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.GH_SCALINGO_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa

      - name: Add Scalingo as a known host
        run: |
          ssh-keyscan -H ssh.osc-fr1.scalingo.com >> ~/.ssh/known_hosts

      - name: Finalize BD TOPO (indexes + millésime)
        run: >
          make ci_bdtopo_finalize
          BIN_COMPOSER="composer"
          BIN_CONSOLE="php bin/console"
          BDTOPO_TARGET="${BDTOPO_TARGET}"

  # Étape 4 : notifie le résultat global du pipeline sur Tchap, quelle que soit l'issue
  # (succès, échec ou annulation). Le statut global et les étapes en échec sont calculés
  # par app:bdtopo:notify à partir des résultats des jobs précédents.
  notify:
    needs: [prepare, import, finalize]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      PREPARE_RESULT: ${{ needs.prepare.result }}
      IMPORT_RESULT: ${{ needs.import.result }}
      FINALIZE_RESULT: ${{ needs.finalize.result }}
      SKIP_IMPORT: ${{ github.event.inputs.skip_import || 'false' }}
      MILLESIME: ${{ needs.prepare.outputs.millesime }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # Dépendance runtime de l'extension PHP GD.
        run: |
          sudo apt-get update
          sudo apt-get install -y libxpm4

      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Init environment variables
        run: |
          echo "TCHAP_HOMESERVER_URL=${{ secrets.TCHAP_HOMESERVER_URL }}" >> .env.local
          echo "TCHAP_ACCESS_TOKEN=${{ secrets.TCHAP_ACCESS_TOKEN }}" >> .env.local
          echo "TCHAP_ROOM_ID=${{ secrets.TCHAP_ROOM_ID }}" >> .env.local

      - name: Send Tchap notification
        run: >
          make ci_bdtopo_notify
          BIN_COMPOSER="composer"
          BIN_CONSOLE="php bin/console"
          BDTOPO_TARGET="${BDTOPO_TARGET}"
          PREPARE_RESULT="${PREPARE_RESULT}"
          IMPORT_RESULT="${IMPORT_RESULT}"
          FINALIZE_RESULT="${FINALIZE_RESULT}"
          SKIP_IMPORT="${SKIP_IMPORT}"
          MILLESIME="${MILLESIME}"
          RUN_URL="${RUN_URL}"
