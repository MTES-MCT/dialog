# Branche de maintenance : ce fichier est inclus par le buildpack nginx de Scalingo
# dans son bloc server {}. Toute requête, quel que soit le chemin ou la méthode,
# reçoit la page statique paas/maintenance.html avec un code 503. Aucune
# application ne tourne derrière.
root /app/paas;
error_page 503 /maintenance.html;

location = /maintenance.html {
    add_header Cache-Control "no-store" always;
    add_header Retry-After 3600 always;
    add_header X-Robots-Tag "noindex" always;
}

location / {
    return 503;
}
