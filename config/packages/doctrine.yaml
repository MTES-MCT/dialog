doctrine:
    dbal:
        default_connection: default
        types:
            datetimetz: App\Infrastructure\Persistence\Doctrine\DBAL\Types\DateTimeTzInterfaceType
            date: App\Infrastructure\Persistence\Doctrine\DBAL\Types\DateInterfaceType
            time: App\Infrastructure\Persistence\Doctrine\DBAL\Types\TimeInterfaceType
        connections:
            default:
                url: '%env(resolve:DATABASE_URL)%'
                server_version: '14'
            bdtopo2025:
                url: '%env(resolve:BDTOPO_DATABASE_URL)%'
                server_version: '14'
            metabase:
                url: '%env(METABASE_DATABASE_URL)%'
                server_version: '14'
    orm:
        enable_native_lazy_objects: true
        default_entity_manager: default
        entity_managers:
            default:
                connection: default
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                auto_mapping: true
                dql:
                    string_functions:
                        FIRST: App\Infrastructure\Persistence\Doctrine\DBAL\FirstFunction
                        # Doctrine functions for PostgreSQL
                        # https://github.com/martin-georgiev/postgresql-for-doctrine
                        PG_ILIKE: MartinGeorgiev\Doctrine\ORM\Query\AST\Functions\Ilike
                        CAST: MartinGeorgiev\Doctrine\ORM\Query\AST\Functions\Cast
                        JSON_ARRAY_LENGTH: MartinGeorgiev\Doctrine\ORM\Query\AST\Functions\JsonArrayLength
                mappings:
                    Domain:
                        is_bundle: false
                        type: xml
                        dir: '%kernel.project_dir%/src/Infrastructure/Persistence/Doctrine/Mapping'
                        prefix: 'App\Domain'
                        alias: 'App\Domain'
            bdtopo2025:
                connection: bdtopo2025
            metabase:
                connection: metabase

when@test:
    doctrine:
        dbal:
            connections:
                default:
                    # "TEST_TOKEN" is typically set by ParaTest
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
                metabase:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
