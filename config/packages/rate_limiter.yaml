framework:
    rate_limiter:
        app:
            policy: 'sliding_window'
            limit: 1500
            interval: '5 minutes'
        api:
            policy: 'sliding_window'
            limit: 5000
            interval: '5 minutes'
        # Limite dédiée aux demandes de réinitialisation de mot de passe
        # (envoi d'e-mails), plus stricte que la limite globale.
        password_reset:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
