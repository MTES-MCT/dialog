security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        local_user:
            id: App\Infrastructure\Security\Provider\LocalPasswordUserProvider
        proconnect_user:
            id: App\Infrastructure\Security\Provider\ProConnectUserProvider
        api_client:
            id: App\Infrastructure\Security\Provider\ApiClientUserProvider
        all:
            chain:
                providers: ['local_user', 'proconnect_user']

    firewalls:
        api:
            pattern: ^/api
            stateless: true
            provider: api_client
            custom_authenticator:
                - App\Infrastructure\Security\Authenticator\ApiClientAuthenticator
        # Public MVT tiles: keep stateless so no PHPSESSID cookie is emitted,
        # allowing shared caches (browser, CDN) to cache responses freely.
        tiles:
            pattern: ^/carte/tiles/
            security: false
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: all
            user_checker: App\Infrastructure\Security\UserChecker
            custom_authenticator:
                - App\Infrastructure\Security\Authenticator\ProConnectAuthenticator
            form_login:
                login_path: app_login
                check_path: app_login
                # Restrict password-based login to local accounts only.
                # Without this, the firewall's default chain provider (`all`) can resolve a
                # ProConnect-only account to a ProConnectUser, which does not implement
                # PasswordAuthenticatedUserInterface and makes CheckCredentialsListener throw.
                provider: local_user
                enable_csrf: true
                username_parameter: email
                password_parameter: password
                # Après connexion, rediriger vers le tableau de bord (sauf retour vers une page
                # protégée demandée avant le login, ex : lien d'invitation).
                default_target_path: app_landing
            # Protection anti brute-force ciblé : blocage par couple (email, IP)
            # en complément du rate-limiter global par IP.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
            two_factor:
                auth_code_parameter_name: _auth_code
                check_path: 2fa_login_check
                auth_form_path: 2fa_login
                enable_csrf: true

    access_control:
        - { path: '^/api/regulations/json', roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: '^/api/regulations/search', roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: '^/api/regulations$', roles: ROLE_API, methods: [POST] }
        - { path: '^/api/organization', roles: ROLE_API, methods: [POST, GET] }
        - { path: ^/api, roles: PUBLIC_ACCESS }
        # Étape de double authentification : accessible uniquement une fois le mot de passe validé.
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin, roles: ROLE_SUPER_ADMIN }
        - { path: '^/regulations/([0-9a-f]{8}-[0-9a-f]{4}-[13-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$', methods: [GET], roles: PUBLIC_ACCESS }
        - { path: '^/regulations$', methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/_fragment/map, roles: PUBLIC_ACCESS }
        # Draft regulations on the map are private and organization-scoped (served as GeoJSON,
        # not cached), unlike the public MVT tiles handled by the stateless `tiles` firewall.
        - { path: ^/carte/drafts, roles: ROLE_USER }
        - { path: '^/(_fragment|regulations|feedback|mon-espace)', roles: ROLE_USER }
        - { path: ^/, roles: PUBLIC_ACCESS }

    role_hierarchy:
        ROLE_SUPER_ADMIN: ROLE_USER

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: "plaintext"
        firewalls:
            main:
                # Seuil élevé en test : le cache du rate limiter persiste entre les
                # exécutions, un seuil bas rendrait les tests de login instables.
                login_throttling:
                    max_attempts: 1000
